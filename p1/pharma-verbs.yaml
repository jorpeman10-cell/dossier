# Pharma value-chain verb dictionary (seed, v0.1)
# Purpose: normalize resume duty verbs to canonical pharma-domain verbs,
# improving five-tuple extraction quality and enabling domain tagging.
# Format: canonical_verb: {domain, aliases[], typical_object, typical_output}

入组:
  domain: CLINICAL
  aliases: [招募受试者, 筛选入组, 患者入组, subject enrollment]
  typical_object: 受试者/临床试验
  typical_output: 入组数据/进度报告
随访:
  domain: CLINICAL
  aliases: [follow-up, 受试者随访]
  typical_object: 受试者
  typical_output: 随访记录
